name: AgForward Static Validation

on:
  push:
    branches:
      - main
      - phase0-foundation-hardening
      - offline-foundations
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository structure
        run: python tools/validate_repository.py

      - name: Test runtime analysis tools
        run: python -m unittest tests/test_runtime_tools.py

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua syntax
        run: find src -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run offline save service tests
        run: lua5.1 tests/offline_save_service_tests.lua

      - name: Run offline finance tests
        run: lua5.1 tests/offline_finance_tests.lua

      - name: Run offline invariant matrix
        run: lua5.1 tests/offline_invariant_tests.lua

      - name: Run offline CILOC policy tests
        run: lua5.1 tests/offline_ciloc_policy_tests.lua

      - name: Run offline credit policy tests
        run: lua5.1 tests/offline_credit_policy_tests.lua

      - name: Run whole-farm credit profile tests
        run: lua5.1 tests/offline_credit_profile_tests.lua

      - name: Run project finance and variable-rate tests
        run: lua5.1 tests/offline_project_rate_tests.lua

      - name: Run product and accounting contract tests
        run: lua5.1 tests/offline_contract_tests.lua

      - name: Run offline asset model tests
        run: lua5.1 tests/offline_asset_tests.lua

      - name: Run offline policy and protocol tests
        run: lua5.1 tests/offline_policy_tests.lua

      - name: Run offline reporting tests
        run: lua5.1 tests/offline_reporting_tests.lua
